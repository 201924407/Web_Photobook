<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hey!Hey!졸업기념포토북</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #fff;
            color: #333;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            min-height: 400vh;
            position: relative;
            background-image: url('/images/background_combined.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-x: hidden;
            scroll-behavior: smooth;
            transition: transform 0.5s ease;
        }

        .section {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .section.empty, .section.photo, .section.video, .section.letter {
            background: none;
        }

        .item {
            width: 60%; /* Reduced from 80% to prevent mobile cutoff */
            height: 60%; /* Reduced from 80% to prevent mobile cutoff */
            background-size: contain; /* Changed to contain for better scaling */
            background-position: center;
            background-repeat: no-repeat;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.4s ease; /* Increased to 0.4s */
        }

        .item.visible {
            opacity: 1;
        }

        .item.outside-viewport {
            opacity: 0;
        }

        .item:hover {
            transform: scale(1.05);
            transition: transform 0.3s ease;
        }

        #first-image {
            background-image: url('/images/background_1page_image.png');
        }

        #photo-btn {
            background-image: url('/button/image.png');
            position: absolute;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
        }

        #video-btn {
            background-image: url('/button/video.png');
            position: absolute;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
        }

        #letter-btn {
            background-image: url('/button/letter.png');
            position: absolute;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
        }

        /* Responsive image scaling */
        @media (max-width: 768px) {
            .item {
                width: 50%;
                height: 50%;
            }
        }

        @media (max-width: 480px) {
            .item {
                width: 40%;
                height: 40%;
            }
        }

        .enlarged {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background-color: #fff;
            border: 3px solid #87CEEB;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            overflow: auto;
            display: none;
            width: 90%;
            max-width: 90%;
            height: auto;
            max-height: 80vh;
            flex-direction: column;
        }

        /* ... (keep existing enlarged styles) ... */

    </style>
</head>
<body>
    <div class="container">
        <div class="section empty">
            <div id="first-image" class="item" onclick="showFirstAction()"></div>
        </div>
        <div class="section photo">
            <div id="photo-btn" class="item" onclick="showBook()"></div>
        </div>
        <div class="section video">
            <div id="video-btn" class="item" onclick="showTablet()"></div>
        </div>
        <div class="section letter">
            <div id="letter-btn" class="item" onclick="showLetter()"></div>
        </div>
    </div>

    <!-- ... (keep existing audio and enlarged content) ... -->

    <script>
        let photoIndex = 0;
        let letterIndex = 0;
        const audio = document.getElementById('backgroundMusic');
        let isPlaying = false;
        let currentSection = 0;

        // Modified page load handler for fade-in of first page
        window.addEventListener('load', function() {
            audio.volume = 1;
            audio.play().then(() => {
                isPlaying = true;
                document.getElementById('toggleAudio').textContent = '배경음 끄기';
            }).catch(error => {
                console.log("자동 재생 실패: ", error);
                isPlaying = false;
                document.getElementById('toggleAudio').textContent = '배경음 켜기';
            });
            
            // Fade in first image on load
            const firstImage = document.getElementById('first-image');
            if (firstImage) {
                setTimeout(() => {
                    firstImage.classList.add('visible');
                }, 100); // Small delay to ensure transition works
            }
            
            // Hide other items initially
            const items = document.querySelectorAll('.item');
            items.forEach(item => {
                if (item !== firstImage) {
                    item.classList.remove('visible');
                    item.classList.add('outside-viewport');
                }
            });
        });

        // ... (keep existing scroll and other functions) ...

    </script>
</body>
</html>
