<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>추억의 책상 포토북</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #fff;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .desk {
            width: 1200px;
            height: 700px;
            position: relative;
            background-image: url('/background_desk.png'); /* 제공된 배경 이미지로 교체 */
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .book, .tablet {
            position: absolute;
            cursor: pointer;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        .book {
            width: 200px; /* 포토 프레임 크기 조정 */
            height: 150px;
            top: 200px; /* 이미지에서 포토 프레임 위치 조정 */
            left: 150px; /* 이미지에서 포토 프레임 위치 조정 */
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            background: transparent; /* 배경 제거, 이미지에 의존 */
        }

        .tablet {
            width: 250px;
            height: 150px;
            top: 200px; /* 이미지에서 태블릿 위치 조정 */
            left: 400px; /* 이미지에서 태블릿 위치 조정 */
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            background: transparent; /* 배경 제거, 이미지에 의존 */
        }

        .book:hover, .tablet:hover {
            transform: scale(1.05);
        }

        .enlarged {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background-color: #fff;
            border: 5px solid #87CEEB;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
            display: none;
        }

        .book-enlarged {
            width: 800px;
            height: 600px;
        }

        .tablet-enlarged {
            width: 900px;
            height: 500px;
        }

        .photo-slideshow, .video-gallery {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .slide {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .slide.active {
            display: block;
        }

        .video-item {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 90%;
            height: 90%;
            object-fit: cover;
            border-radius: 5px;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #87CEEB;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1001;
        }

        .back-button:hover {
            background-color: #76c0e7;
        }

        .slide-controls {
            text-align: center;
            margin-top: 10px;
        }

        .slide-controls button {
            background-color: #87CEEB;
            color: #fff;
            border: none;
            padding: 8px 15px;
            margin: 0 5px;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .slide-controls button:hover {
            background-color: #76c0e7;
        }

        .video-controls {
            margin-top: 10px;
            text-align: center;
        }

        .video-controls button {
            background-color: #87CEEB;
            color: #fff;
            border: none;
            padding: 8px 15px;
            margin: 0 5px;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .video-controls button:hover {
            background-color: #76c0e7;
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .desk {
                width: 90%;
                height: 500px;
            }

            .book {
                width: 150px;
                height: 100px;
                top: 150px;
                left: 50px;
            }

            .tablet {
                width: 200px;
                height: 100px;
                top: 150px;
                left: 250px;
            }

            .book-enlarged {
                width: 90%;
                height: 400px;
            }

            .tablet-enlarged {
                width: 90%;
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="desk">
        <div class="book" onclick="showBook()">추억의 책</div>
        <div class="tablet" onclick="showTablet()">추억의 태블릿</div>
    </div>

    <div class="enlarged book-enlarged" id="bookView" style="display: none;">
        <button class="back-button" onclick="hideEnlarged()">뒤로가기</button>
        <div class="photo-slideshow">
            <!-- 20개의 사진 슬라이드 (임시 이미지 URL 사용) -->
            <img class="slide" src="https://via.placeholder.com/800x600.png?text=추억+사진+1" alt="추억 사진 1">
            <img class="slide" src="https://via.placeholder.com/800x600.png?text=추억+사진+2" alt="추억 사진 2">
            <img class="slide" src="https://via.placeholder.com/800x600.png?text=추억+사진+3" alt="추억 사진 3">
            <!-- 나머지 17개 사진도 비슷한 형식으로 추가 (총 20개) -->
            <img class="slide" src="https://via.placeholder.com/800x600.png?text=추억+사진+20" alt="추억 사진 20">
        </div>
        <div class="slide-controls">
            <button onclick="prevPhoto()">이전 페이지</button>
            <button onclick="nextPhoto()">다음 페이지</button>
        </div>
    </div>

    <div class="enlarged tablet-enlarged" id="tabletView" style="display: none;">
        <button class="back-button" onclick="hideEnlarged()">뒤로가기</button>
        <div class="video-gallery">
            <!-- 10개의 동영상 (your-video.mp4 사용, 실제 동영상으로 교체 필요) -->
            <div class="video-item">
                <video id="video1">
                    <source src="/your-video.mp4" type="video/mp4">
                    브라우저가 동영상을 지원하지 않습니다.
                </video>
                <div class="video-controls">
                    <button onclick="playVideo('video1')">재생</button>
                    <button onclick="pauseVideo('video1')">일시정지</button>
                    <button onclick="stopVideo('video1')">정지</button>
                </div>
            </div>
            <!-- 나머지 9개 동영상도 비슷한 형식으로 추가 (your-video.mp4 복사본 사용) -->
            <div class="video-item">
                <video id="video10">
                    <source src="/your-video.mp4" type="video/mp4">
                    브라우저가 동영상을 지원하지 않습니다.
                </video>
                <div class="video-controls">
                    <button onclick="playVideo('video10')">재생</button>
                    <button onclick="pauseVideo('video10')">일시정지</button>
                    <button onclick="stopVideo('video10')">정지</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let photoIndex = 0;

        function showBook() {
            document.getElementById('bookView').style.display = 'block';
            showPhotos();
        }

        function showTablet() {
            document.getElementById('tabletView').style.display = 'block';
        }

        function hideEnlarged() {
            document.getElementById('bookView').style.display = 'none';
            document.getElementById('tabletView').style.display = 'none';
        }

        function showPhotos() {
            const photos = document.getElementsByClassName("slide");
            for (let i = 0; i < photos.length; i++) {
                photos[i].classList.remove("active");
            }
            photoIndex++;
            if (photoIndex > photos.length) { photoIndex = 1; }
            photos[photoIndex - 1].classList.add("active");
            setTimeout(showPhotos, 5000); // 5초마다 자동 전환
        }

        function prevPhoto() {
            const photos = document.getElementsByClassName("slide");
            photoIndex--;
            if (photoIndex < 1) { photoIndex = photos.length; }
            for (let i = 0; i < photos.length; i++) {
                photos[i].classList.remove("active");
            }
            photos[photoIndex - 1].classList.add("active");
        }

        function nextPhoto() {
            const photos = document.getElementsByClassName("slide");
            photoIndex++;
            if (photoIndex > photos.length) { photoIndex = 1; }
            for (let i = 0; i < photos.length; i++) {
                photos[i].classList.remove("active");
            }
            photos[photoIndex - 1].classList.add("active");
        }

        function playVideo(videoId) {
            const video = document.getElementById(videoId);
            video.play();
        }

        function pauseVideo(videoId) {
            const video = document.getElementById(videoId);
            video.pause();
        }

        function stopVideo(videoId) {
            const video = document.getElementById(videoId);
            video.pause();
            video.currentTime = 0;
        }
    </script>
</body>
</html>
