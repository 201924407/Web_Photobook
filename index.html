<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>추억의 책상 포토북 (모바일)</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #fff;
            color: #333;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            min-height: 400vh; /* 4개의 페이지로 확장 */
            position: relative;
            background-image: url('/images/background_combined.png'); /* 단일 이미지로 변경 */
            background-size: auto 100%; /* 전체 높이에 맞춤 */
            background-position: center top;
            background-repeat: no-repeat;
            border-radius: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-x: hidden;
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
        }

        .section {
            width: 100%;
            height: 100vh;
            position: relative;
            display: block; /* flex 대신 block으로 변경, 아이템을 절대 위치로 배치 */
            scroll-snap-align: center;
            background: none;
        }

        .item {
            position: absolute; /* 아이템을 절대 위치로 설정 */
            transition: opacity 0.5s ease; /* 호버 효과 제거, 페이드인만 유지 */
            opacity: 1; /* 초기에는 항상 보이도록 설정 */
            width: 100%; /* 화면을 꽉 채우도록 너비 설정 */
            height: 100%; /* 화면을 꽉 채우도록 높이 설정 */
            background-size: cover; /* 이미지 비율 유지하며 화면 채우기 */
            background-repeat: no-repeat;
            cursor: pointer;
        }

        /* 재생/일시정지 버튼은 기존 크기와 위치 유지, 호버 효과 유지 */
        .audio .item#audio-play-pause {
            width: 80px;
            height: 80px;
            background-image: url('/button/play.png');
            top: 50%;
            left: 30%;
            transform: translate(-50%, -50%);
            transition: opacity 0.5s ease, transform 0.3s ease; /* 호버 효과 유지 */
        }

        .audio .item#audio-play-pause:hover {
            transform: scale(1.05); /* 호버 시 확대 유지 */
        }

        /* 오디오 이미지도 기존 크기 유지, 하지만 호버 효과 제거 */
        .audio .item#audio-image {
            width: 200px;
            height: 200px;
            background-image: url('/images/audio_image.png');
            top: 20%;
            left: 70%;
            transform: translate(-50%, -50%);
            transition: opacity 0.5s ease; /* 호버 효과 제거 */
        }

        /* 음량 조절 슬라이더는 기존 위치 유지 */
        .audio input[type="range"]#volume-control {
            width: 200px;
            height: 20px;
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
        }

        /* 사진, 비디오, 편지 버튼 및 이미지 - 화면 꽉 채우기, 호버 효과 제거 */
        .photo .item#photo-btn,
        .video .item#video-btn,
        .letter .item#letter-btn,
        .photo .item.photo-1,
        .photo .item.photo-2,
        .photo .item.photo-3,
        .video .item.video-1,
        .video .item.video-2,
        .letter .item.letter-1,
        .letter .item.letter-2 {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-repeat: no-repeat;
            top: 0;
            left: 0;
            transform: none; /* 중앙 정렬 대신 전체 화면 커버 */
            transition: opacity 0.5s ease; /* 호버 효과 제거 */
        }

        /* 각 섹션의 버튼 및 이미지 배경 이미지 설정 */
        .photo .item#photo-btn { background-image: url('/button/picture.png'); }
        .photo .item.photo-1 { background-image: url('/pictures/picture_1.jpg'); }
        .photo .item.photo-2 { background-image: url('/pictures/picture_2.jpg'); }
        .photo .item.photo-3 { background-image: url('/pictures/picture_3.jpg'); }
        .video .item#video-btn { background-image: url('/button/video.png'); }
        .video .item.video-1 { background-image: url('/your-video-thumbnail.jpg'); }
        .video .item.video-2 { background-image: url('/your-video-thumbnail2.jpg'); }
        .letter .item#letter-btn { background-image: url('/button/letter.png'); }
        .letter .item.letter-1 { background-image: url('https://via.placeholder.com/200x150.png?text=편지+1'); }
        .letter .item.letter-2 { background-image: url('https://via.placeholder.com/150x100.png?text=편지+2'); }

        /* 버튼 및 이미지 공통 스타일 */
        .button, .audio-image {
            cursor: pointer;
        }

        /* 확대 뷰 스타일 */
        .enlarged {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background-color: #fff;
            border: 3px solid #87CEEB;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            overflow: auto;
            display: none;
            width: 90%;
            max-width: 90%;
            height: auto;
            max-height: 80vh;
            flex-direction: column;
        }

        .audio-control-enlarged, .book-enlarged, .tablet-enlarged, .letter-enlarged {
            max-height: 400px;
        }

        /* 오디오 컨트롤 스타일 (확대 뷰) */
        .audio-control-panel {
            width: 100%;
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .audio-control-panel button {
            background-color: #87CEEB;
            color: #fff;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1em;
        }

        .audio-control-panel input[type="range"] {
            width: 200px;
            cursor: pointer;
            -webkit-appearance: none;
            background: #ddd;
            border-radius: 5px;
            height: 5px;
            outline: none;
        }

        .audio-control-panel input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            background: #87CEEB;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="section audio">
            <div class="item audio-image" id="audio-image" onclick="showAudioControl()"></div>
            <div class="item button" id="audio-play-pause" onclick="toggleAudio()"></div>
            <input type="range" id="volume-control" min="0" max="1" step="0.01" value="1" oninput="adjustVolume(this.value)">
        </div>
        <div class="section photo">
            <div class="item button" id="photo-btn" onclick="showBook()"></div>
            <div class="item photo-item photo-1"></div>
            <div class="item photo-item photo-2"></div>
            <div class="item photo-item photo-3"></div>
        </div>
        <div class="section video">
            <div class="item button" id="video-btn" onclick="showTablet()"></div>
            <div class="item video-item video-1"></div>
            <div class="item video-item video-2"></div>
        </div>
        <div class="section letter">
            <div class="item button" id="letter-btn" onclick="showLetter()"></div>
            <div class="item letter-item letter-1"></div>
            <div class="item letter-item letter-2"></div>
        </div>
    </div>

    <audio id="backgroundMusic" loop>
        <source src="/audio/background_music.mp3" type="audio/mp3">
        브라우저가 오디오를 지원하지 않습니다.
    </audio>

    <!-- 오디오 컨트롤 확대 뷰 -->
    <div class="enlarged audio-control-enlarged" id="audioControlView">
        <button class="back-button" onclick="hideEnlarged()">뒤로가기</button>
        <div class="audio-control-panel">
            <button id="toggleAudioEnlarged" onclick="toggleAudio()">배경음 끄기</button>
            <input type="range" id="volumeControlEnlarged" min="0" max="1" step="0.01" value="1" oninput="adjustVolume(this.value)">
        </div>
    </div>

    <!-- 사진 확대 뷰 -->
    <div class="enlarged book-enlarged" id="bookView">
        <button class="back-button" onclick="hideEnlarged()">뒤로가기</button>
        <div class="photo-slideshow">
            <img class="slide" src="/pictures/picture_1.jpg" alt="추억 사진 1">
            <img class="slide" src="/pictures/picture_2.jpg" alt="추억 사진 2">
            <img class="slide" src="/pictures/picture_3.jpg" alt="추억 사진 3">
            <img class="slide" src="/pictures/picture_4.jpg" alt="추억 사진 4">
            <img class="slide" src="/pictures/picture_5.jpg" alt="추억 사진 5">
            <img class="slide" src="/pictures/picture_6.jpg" alt="추억 사진 6">
            <img class="slide" src="/pictures/picture_7.jpg" alt="추억 사진 7">
        </div>
        <div class="slide-controls">
            <button onclick="prevPhoto()">이전 페이지</button>
            <button onclick="nextPhoto()">다음 페이지</button>
        </div>
    </div>

    <!-- 비디오 확대 뷰 -->
    <div class="enlarged tablet-enlarged" id="tabletView">
        <button class="back-button" onclick="hideEnlarged()">뒤로가기</button>
        <div class="video-gallery">
            <div class="video-item">
                <video id="video1">
                    <source src="/your-video.mp4" type="video/mp4">
                    브라우저가 동영상을 지원하지 않습니다.
                </video>
                <div class="video-controls">
                    <button onclick="playVideo('video1')">재생</button>
                    <button onclick="pauseVideo('video1')">일시정지</button>
                    <button onclick="stopVideo('video1')">정지</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 편지 확대 뷰 -->
    <div class="enlarged letter-enlarged" id="letterView">
        <button class="back-button" onclick="hideEnlarged()">뒤로가기</button>
        <div class="letter-gallery">
            <img class="letter-slide" src="https://via.placeholder.com/800x600.png?text=추억+편지+1" alt="추억 편지 1">
            <img class="letter-slide" src="https://via.placeholder.com/800x600.png?text=추억+편지+2" alt="추억 편지 2">
            <img class="letter-slide" src="https://via.placeholder.com/800x600.png?text=추억+편지+3" alt="추억 편지 3">
        </div>
        <div class="letter-controls">
            <button onclick="prevLetter()">이전 편지</button>
            <button onclick="nextLetter()">다음 편지</button>
        </div>
    </div>

    <script>
        let currentSection = 0;
        let isPlaying = false;

        // 페이지 로드 시 초기 설정
        window.addEventListener('load', function() {
            const audio = document.getElementById('backgroundMusic');
            audio.volume = 1;
            audio.play().then(() => {
                isPlaying = true;
                updatePlayPauseButton();
                document.getElementById('toggleAudioEnlarged').textContent = '배경음 끄기';
            }).catch(error => {
                console.log("자동 재생 실패: ", error);
            });
            updateButtons(); // 초기 버튼 상태 설정
        });

        // 스크롤 이벤트 처리
        window.addEventListener('scroll', function() {
            const scrollPosition = window.scrollY;
            const windowHeight = window.innerHeight;
            let newSection = Math.round(scrollPosition / windowHeight);

            if (newSection !== currentSection) {
                currentSection = newSection;
                updateButtons();
            }
        });

        // 버튼 및 이미지 표시/숨김
        function updateButtons() {
            const elements = document.querySelectorAll('.item');
            elements.forEach((element, index) => {
                if (index === currentSection) {
                    element.classList.add('active');
                } else {
                    element.classList.remove('active');
                }
            });
        }

        // 오디오 재생/일시정지 토글
        function toggleAudio() {
            const audio = document.getElementById('backgroundMusic');
            if (isPlaying) {
                audio.pause();
                document.getElementById('toggleAudioEnlarged').textContent = '배경음 켜기';
            } else {
                audio.play();
                document.getElementById('toggleAudioEnlarged').textContent = '배경음 끄기';
            }
            isPlaying = !isPlaying;
            updatePlayPauseButton();
        }

        // 재생/일시정지 버튼 이미지 업데이트
        function updatePlayPauseButton() {
            const playPauseBtn = document.getElementById('audio-play-pause');
            if (isPlaying) {
                playPauseBtn.style.backgroundImage = "url('/button/pause.png')";
            } else {
                playPauseBtn.style.backgroundImage = "url('/button/play.png')";
            }
        }

        // 음량 조절
        function adjustVolume(volume) {
            const audio = document.getElementById('backgroundMusic');
            audio.volume = volume;
            if (volume > 0 && !isPlaying) {
                audio.play();
                isPlaying = true;
                document.getElementById('toggleAudioEnlarged').textContent = '배경음 끄기';
                updatePlayPauseButton();
            } else if (volume == 0 && isPlaying) {
                audio.pause();
                isPlaying = false;
                document.getElementById('toggleAudioEnlarged').textContent = '배경음 켜기';
                updatePlayPauseButton();
            }
        }

        // 확대 뷰 표시 함수
        function showAudioControl() {
            document.getElementById('audioControlView').style.display = 'flex';
        }

        function showBook() {
            document.getElementById('bookView').style.display = 'flex';
            initPhotos();
        }

        function showTablet() {
            document.getElementById('tabletView').style.display = 'flex';
            initVideos();
        }

        function showLetter() {
            document.getElementById('letterView').style.display = 'flex';
            initLetters();
        }

        function hideEnlarged() {
            document.querySelectorAll('.enlarged').forEach(el => el.style.display = 'none');
        }

        // 사진 슬라이드쇼
        let currentSlide = 0;
        function initPhotos() {
            currentSlide = 0;
            showSlide();
        }

        function showSlide() {
            const slides = document.querySelectorAll('.slide');
            slides.forEach((slide, index) => {
                slide.style.display = index === currentSlide ? 'block' : 'none';
            });
        }

        function nextPhoto() {
            const slides = document.querySelectorAll('.slide');
            currentSlide = (currentSlide + 1) % slides.length;
            showSlide();
        }

        function prevPhoto() {
            const slides = document.querySelectorAll('.slide');
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            showSlide();
        }

        // 비디오 초기화
        function initVideos() {
            // 비디오 초기화 로직
        }

        function playVideo(videoId) {
            document.getElementById(videoId).play();
        }

        function pauseVideo(videoId) {
            document.getElementById(videoId).pause();
        }

        function stopVideo(videoId) {
            const video = document.getElementById(videoId);
            video.pause();
            video.currentTime = 0;
        }

        // 편지 슬라이드쇼
        let currentLetter = 0;
        function initLetters() {
            currentLetter = 0;
            showLetterSlide();
        }

        function showLetterSlide() {
            const letters = document.querySelectorAll('.letter-slide');
            letters.forEach((letter, index) => {
                letter.style.display = index === currentLetter ? 'block' : 'none';
            });
        }

        function nextLetter() {
            const letters = document.querySelectorAll('.letter-slide');
            currentLetter = (currentLetter + 1) % letters.length;
            showLetterSlide();
        }

        function prevLetter() {
            const letters = document.querySelectorAll('.letter-slide');
            currentLetter = (currentLetter - 1 + letters.length) % letters.length;
            showLetterSlide();
        }
    </script>
</body>
</html>
