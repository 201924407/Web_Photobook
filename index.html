<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>추억의 책상 포토북 (모바일)</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #fff;
            color: #333;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

     .container {
    width: 100%;
    min-height: 400vh; /* 4개의 페이지로 확장 */
    position: relative;
    background-image: url('/images/background_combined.png'); /* 제공된 단일 이미지로 변경 */
    background-size: auto 100%; /* 전체 높이에 맞춤 (4개 섹션 모두 커버) */
    background-position: center top;
    background-repeat: no-repeat; /* 반복하지 않음, 단일 이미지 사용 */
    /* 경계 부드럽게 블랜딩 효과 (필요 시 유지) */
    background-blend-mode: overlay;
    /* 부드러운 전환을 위한 그래디언트 추가 (선택적) */
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0) 90%, rgba(0, 0, 0, 0.1) 100%), url('/images/background_combined.png');
    border-radius: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    overflow-x: hidden;
    scroll-behavior: smooth; /* 부드러운 스크롤 */
    scroll-snap-type: y mandatory; /* 스크롤 스냅 */
}

        .section {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-snap-align: center; /* 섹션 중앙에 부드럽게 멈춤 */
            background: none; /* 섹션 배경 제거, 컨테이너 배경만 사용 */
        }

        .section.audio, .section.photo, .section.video, .section.letter {
            background: none; /* 동일한 배경 유지, 컨테이너 배경 사용 */
        }

        .button, .audio-image {
            position: relative; /* 절대 위치 제거, 상대 위치로 변경 */
            background-size: contain; /* 이미지 비율 유지 */
            background-repeat: no-repeat;
            cursor: pointer;
            opacity: 0; /* 초기에는 투명 */
            transition: opacity 0.5s ease; /* 페이드인만 유지 */
        }

        .button.active, .audio-image.active {
            opacity: 1; /* 활성화 시 보임, 페이드인만 적용 */
        }

        .button:hover {
            transform: scale(1.05);
            transition: transform 0.3s ease;
        }

        /* 버튼 및 이미지 크기 및 위치 (이미지 기준 가정) */
        #audio-play-pause {
            width: 80px;
            height: 80px;
            background-image: url('/button/play.png'); /* 기본 재생 이미지 */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #volume-control {
            width: 200px;
            height: 20px;
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #audio-image {
            width: 200px;
            height: 200px;
            background-image: url('/images/audio_image.png'); /* 추가 이미지 경로 */
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #photo-btn {
            width: 120px;
            height: 120px;
            background-image: url('/button/picture.png');
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #video-btn {
            width: 120px;
            height: 120px;
            background-image: url('/button/video.png');
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #letter-btn {
            width: 120px;
            height: 120px;
            background-image: url('/button/letter.png');
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .enlarged {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background-color: #fff;
            border: 3px solid #87CEEB;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            overflow: auto;
            display: none;
            width: 90%;
            max-width: 90%;
            height: auto;
            max-height: 80vh;
            flex-direction: column;
        }

        .audio-control-enlarged, .book-enlarged, .tablet-enlarged, .letter-enlarged {
            max-height: 400px;
        }

        /* 오디오 컨트롤 스타일 (확대 뷰) */
        .audio-control-panel {
            width: 100%;
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .audio-control-panel button {
            background-color: #87CEEB;
            color: #fff;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1em;
        }

        .audio-control-panel input[type="range"] {
            width: 200px;
            cursor: pointer;
            -webkit-appearance: none;
            background: #ddd;
            border-radius: 5px;
            height: 5px;
            outline: none;
        }

        .audio-control-panel input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            background: #87CEEB;
            border-radius: 50%;
            cursor: pointer;
        }

        /* 나머지 스타일 (photo-slideshow, video-gallery 등)은 기존과 동일 */
    </style>
</head>
<body>
    <div class="container">
        <div class="section audio">
            <div id="audio-image" class="audio-image" onclick="showAudioControl()"></div>
            <div id="audio-play-pause" class="button" onclick="toggleAudio()"></div>
            <input type="range" id="volume-control" min="0" max="1" step="0.01" value="1" oninput="adjustVolume(this.value)">
        </div>
        <div class="section photo">
            <div id="photo-btn" class="button" onclick="showBook()"></div>
        </div>
        <div class="section video">
            <div id="video-btn" class="button" onclick="showTablet()"></div>
        </div>
        <div class="section letter">
            <div id="letter-btn" class="button" onclick="showLetter()"></div>
        </div>
    </div>

    <audio id="backgroundMusic" loop>
        <source src="/audio/background_music.mp3" type="audio/mp3">
        브라우저가 오디오를 지원하지 않습니다.
    </audio>

    <!-- 오디오 컨트롤 확대 뷰 -->
    <div class="enlarged audio-control-enlarged" id="audioControlView">
        <button class="back-button" onclick="hideEnlarged()">뒤로가기</button>
        <div class="audio-control-panel">
            <button id="toggleAudioEnlarged" onclick="toggleAudio()">배경음 끄기</button>
            <input type="range" id="volumeControlEnlarged" min="0" max="1" step="0.01" value="1" oninput="adjustVolume(this.value)">
        </div>
    </div>

    <!-- 사진 확대 뷰 -->
    <div class="enlarged book-enlarged" id="bookView">
        <button class="back-button" onclick="hideEnlarged()">뒤로가기</button>
        <div class="photo-slideshow">
            <img class="slide" src="/pictures/picture_1.jpg" alt="추억 사진 1">
            <img class="slide" src="/pictures/picture_2.jpg" alt="추억 사진 2">
            <img class="slide" src="/pictures/picture_3.jpg" alt="추억 사진 3">
            <img class="slide" src="/pictures/picture_4.jpg" alt="추억 사진 4">
            <img class="slide" src="/pictures/picture_5.jpg" alt="추억 사진 5">
            <img class="slide" src="/pictures/picture_6.jpg" alt="추억 사진 6">
            <img class="slide" src="/pictures/picture_7.jpg" alt="추억 사진 7">
        </div>
        <div class="slide-controls">
            <button onclick="prevPhoto()">이전 페이지</button>
            <button onclick="nextPhoto()">다음 페이지</button>
        </div>
    </div>

    <!-- 비디오 확대 뷰 -->
    <div class="enlarged tablet-enlarged" id="tabletView">
        <button class="back-button" onclick="hideEnlarged()">뒤로가기</button>
        <div class="video-gallery">
            <div class="video-item">
                <video id="video1">
                    <source src="/your-video.mp4" type="video/mp4">
                    브라우저가 동영상을 지원하지 않습니다.
                </video>
                <div class="video-controls">
                    <button onclick="playVideo('video1')">재생</button>
                    <button onclick="pauseVideo('video1')">일시정지</button>
                    <button onclick="stopVideo('video1')">정지</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 편지 확대 뷰 -->
    <div class="enlarged letter-enlarged" id="letterView">
        <button class="back-button" onclick="hideEnlarged()">뒤로가기</button>
        <div class="letter-gallery">
            <img class="letter-slide" src="https://via.placeholder.com/800x600.png?text=추억+편지+1" alt="추억 편지 1">
            <img class="letter-slide" src="https://via.placeholder.com/800x600.png?text=추억+편지+2" alt="추억 편지 2">
            <img class="letter-slide" src="https://via.placeholder.com/800x600.png?text=추억+편지+3" alt="추억 편지 3">
        </div>
        <div class="letter-controls">
            <button onclick="prevLetter()">이전 편지</button>
            <button onclick="nextLetter()">다음 편지</button>
        </div>
    </div>

    <script>
        let currentSection = 0;
        let isPlaying = false;

        // 페이지 로드 시 초기 설정
        window.addEventListener('load', function() {
            const audio = document.getElementById('backgroundMusic');
            audio.volume = 1;
            audio.play().then(() => {
                isPlaying = true;
                updatePlayPauseButton();
                document.getElementById('toggleAudioEnlarged').textContent = '배경음 끄기';
            }).catch(error => {
                console.log("자동 재생 실패: ", error);
            });
            updateButtons(); // 초기 버튼 상태 설정
        });

        // 스크롤 이벤트 처리
        window.addEventListener('scroll', function() {
            const scrollPosition = window.scrollY;
            const windowHeight = window.innerHeight;
            let newSection = Math.round(scrollPosition / windowHeight);

            if (newSection !== currentSection) {
                currentSection = newSection;
                updateButtons();
            }
        });

        // 버튼 및 이미지 표시/숨김 및 페이드인 (페이드아웃 제거)
        function updateButtons() {
            const elements = document.querySelectorAll('.button, .audio-image');
            elements.forEach((element, index) => {
                if (index === currentSection) {
                    element.classList.add('active');
                } else {
                    // 페이드아웃 제거: opacity를 0으로 강제로 설정하지 않음
                    element.classList.remove('active');
                }
            });
        }

        // 오디오 재생/일시정지 토글
        function toggleAudio() {
            const audio = document.getElementById('backgroundMusic');
            if (isPlaying) {
                audio.pause();
                document.getElementById('toggleAudioEnlarged').textContent = '배경음 켜기';
            } else {
                audio.play();
                document.getElementById('toggleAudioEnlarged').textContent = '배경음 끄기';
            }
            isPlaying = !isPlaying;
            updatePlayPauseButton();
        }

        // 재생/일시정지 버튼 이미지 업데이트
        function updatePlayPauseButton() {
            const playPauseBtn = document.getElementById('audio-play-pause');
            if (isPlaying) {
                playPauseBtn.style.backgroundImage = "url('/button/pause.png')";
            } else {
                playPauseBtn.style.backgroundImage = "url('/button/play.png')";
            }
        }

        // 음량 조절
        function adjustVolume(volume) {
            const audio = document.getElementById('backgroundMusic');
            audio.volume = volume;
            if (volume > 0 && !isPlaying) {
                audio.play();
                isPlaying = true;
                document.getElementById('toggleAudioEnlarged').textContent = '배경음 끄기';
                updatePlayPauseButton();
            } else if (volume == 0 && isPlaying) {
                audio.pause();
                isPlaying = false;
                document.getElementById('toggleAudioEnlarged').textContent = '배경음 켜기';
                updatePlayPauseButton();
            }
        }

        // 확대 뷰 표시 함수
        function showAudioControl() {
            document.getElementById('audioControlView').style.display = 'flex';
        }

        function showBook() {
            document.getElementById('bookView').style.display = 'flex';
            initPhotos();
        }

        function showTablet() {
            document.getElementById('tabletView').style.display = 'flex';
            ini
