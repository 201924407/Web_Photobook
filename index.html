<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>추억의 책상 포토북 (모바일)</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #fff;
            color: #333;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .desk {
            width: 100%;
            height: auto;
            min-height: 100vh;
            max-height: 100vh;
            position: relative;
            background-image: url('/background_desk_mobile.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .book, .tablet, .letter {
            position: absolute;
            width: 200px;
            height: 100px;
            background-color: rgba(255, 255, 255, 0);
            cursor: pointer;
        }

        .book {
            top: 140px;
            left: 30%;
            transform: translateX(-50%);
        }

        .tablet {
            top: 360px;
            left: 70%;
            transform: translateX(-50%);
        }

        .letter {
            top: 600px;
            left: 20%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <div class="desk">
        <div class="book" onclick="showBook()"></div>
        <div class="tablet" onclick="showTablet()"></div>
        <div class="letter" onclick="showLetter()"></div>
    </div>

    <script>
        function showBook() {
            alert("추억의 책 보기");
        }

        function showTablet() {
            alert("추억의 영상 보기");
        }

        function showLetter() {
            alert("추억의 편지 보기");
        }
    </script>
</body>
</html>
