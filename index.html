<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>추억의 책상 포토북 (모바일)</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #fff;
            color: #333;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            min-height: 300vh; /* 3개의 페이지로 확장 */
            position: relative;
            background-image: url('/background_desk_mobile.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-x: hidden;
            scroll-behavior: smooth;
            transition: transform 0.5s ease;
            /* 스크롤 스냅 추가 */
            scroll-snap-type: y mandatory;
        }

        .section {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 각 섹션이 스크롤 스냅 지점으로 설정 */
            scroll-snap-align: center;
        }

        .section.empty {
            background: none; /* 첫 번째 페이지 비우기 */
        }

        .section.photo, .section.video, .section.letter {
            background: none; /* 동일한 배경 유지 */
        }

        .button {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            cursor: pointer;
            opacity: 0; /* 초기에는 숨김 */
            transition: opacity 0.5s ease; /* 페이드인 애니메이션 */
        }

        .button.active {
            opacity: 1; /* 페이지 이동 완료 시 표시 */
        }

        .button:hover {
            transform: scale(1.05); /* 버튼 클릭 시 확대 애니메이션 */
            transition: transform 0.3s ease;
        }

        #photo-btn {
            background-image: url('/button/picture.png');
        }

        #video-btn {
            background-image: url('/button/video.png');
        }

        #letter-btn {
            background-image: url('/button/letter.png');
        }

        /* 나머지 스타일은 동일 */
        .enlarged {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background-color: #fff;
            border: 3px solid #87CEEB;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            overflow: auto;
            display: none;
            width: 90%;
            max-width: 90%;
            height: auto;
            max-height: 80vh;
            flex-direction: column;
        }

        .book-enlarged, .tablet-enlarged, .letter-enlarged {
            max-height: 400px;
        }

        /* 나머지 스타일은 생략 */
    </style>
</head>
<body>
    <div class="container">
        <div class="section empty"></div>
        <div class="section photo">
            <div id="photo-btn" class="button" onclick="showBook()"></div>
        </div>
        <div class="section video">
            <div id="video-btn" class="button" onclick="showTablet()"></div>
        </div>
        <div class="section letter">
            <div id="letter-btn" class="button" onclick="showLetter()"></div>
        </div>
    </div>

    <!-- 나머지 HTML (audio, enlarged div 등)은 동일 -->

    <script>
        let currentSection = 0;

        // 페이지 로드 시 초기 설정
        window.addEventListener('load', function() {
            const audio = document.getElementById('backgroundMusic');
            audio.volume = 1;
            audio.play().then(() => {
                isPlaying = true;
                document.getElementById('toggleAudio').textContent = '배경음 끄기';
            }).catch(error => {
                console.log("자동 재생 실패: ", error);
            });
            updateButtons(); // 초기 버튼 상태 설정
        });

        // 스크롤 이벤트 처리
        window.addEventListener('scroll', function() {
            const scrollPosition = window.scrollY;
            const windowHeight = window.innerHeight;
            const sections = document.querySelectorAll('.section');
            let newSection = Math.round(scrollPosition / windowHeight);

            if (newSection !== currentSection) {
                currentSection = newSection;
                updateButtons();
            }
        });

        // 버튼 표시/숨김 및 페이드인 애니메이션
        function updateButtons() {
            const buttons = document.querySelectorAll('.button');
            buttons.forEach((button, index) => {
                if (index === currentSection) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
            });
        }

        // 확대 뷰 표시/숨김 함수 (기존 그대로 유지)
        function showBook() {
            document.getElementById('bookView').style.display = 'flex';
            initPhotos();
        }

        function showTablet() {
            document.getElementById('tabletView').style.display = 'flex';
            initVideo();
        }

        function showLetter() {
            document.getElementById('letterView').style.display = 'flex';
            initLetters();
        }

        function hideEnlarged() {
            document.getElementById('bookView').style.display = 'none';
            document.getElementById('tabletView').style.display = 'none';
            document.getElementById('letterView').style.display = 'none';
        }

        // 나머지 JavaScript 함수 (initPhotos, nextPhoto 등)는 동일
    </script>
</body>
</html>
