<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동영상 플레이어</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        
        .video-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        video {
            width: 640px;
            height: 360px;
            max-width: 100%;
        }
        
        .controls {
            margin-top: 10px;
            text-align: center;
        }
        
        button {
            padding: 10px 20px;
            margin: 0 5px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="myVideo" controls>
            <source src="your-video.mp4" type="video/mp4">
            브라우저가 동영상을 지원하지 않습니다.
        </video>
        <div class="controls">
            <button onclick="playVideo()">재생</button>
            <button onclick="pauseVideo()">일시정지</button>
            <button onclick="stopVideo()">정지</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('myVideo');

        function playVideo() {
            video.play();
        }

        function pauseVideo() {
            video.pause();
        }

        function stopVideo() {
            video.pause();
            video.currentTime = 0;
        }

        // 자동 재생 방지 (일부 브라우저 정책 때문에 muted 속성이 필요할 수 있음)
        video.muted = true;
    </script>
</body>
</html>
