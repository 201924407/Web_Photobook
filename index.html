<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>추억의 책상 포토북 (모바일)</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #fff;
            color: #333;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .desk {
            width: 100%;
            height: auto;
            min-height: 100vh;
            max-height: 100vh;
            position: relative;
            background-image: url('/background_desk_mobile.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .book, .tablet, .letter {
            position: absolute;
            width: 100px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 5px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .book {
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
        }

        .tablet {
            top: 350px;
            left: 50%;
            transform: translateX(-50%);
        }

        .letter {
            top: 550px;
            left: 50%;
            transform: translateX(-50%);
        }

        .book:hover, .tablet:hover, .letter:hover {
            transform: translateX(-50%) scale(1.1);
        }

        .enlarged {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background-color: #fff;
            border: 3px solid #87CEEB;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            overflow: auto;
            display: none;
            width: 90%;
            max-width: 90%;
            height: auto;
            max-height: 80vh;
        }
    </style>
</head>
<body>
    <div class="desk">
        <div class="book" onclick="showBook()">추억의 책</div>
        <div class="tablet" onclick="showTablet()">추억의 영상</div>
        <div class="letter" onclick="showLetter()">추억의 편지</div>
    </div>

    <script>
        function showBook() {
            alert("추억의 책 보기");
        }

        function showTablet() {
            alert("추억의 영상 보기");
        }

        function showLetter() {
            alert("추억의 편지 보기");
        }
    </script>
</body>
</html>
