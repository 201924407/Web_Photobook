<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>추억의 책상 포토북 (모바일)</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #fff;
            color: #333;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .desk {
            width: 100%;
            height: 200vh;
            position: relative;
            background-image: url('/background_desk_mobile.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            scroll-behavior: smooth;
        }

        .section {
            width: 100%;
            height: 50vh;
            position: relative;
        }

        .top-section {
            top: 0;
        }

        .bottom-section {
            top: 50vh;
        }

        .button {
            position: absolute;
            cursor: pointer;
            width: 100px;
            height: 30px;
            background-color: transparent;
            border: none;
        }

        #book-btn {
            top: 130px;
            left: 50px;
        }

        #tablet-btn {
            top: 250px;
            left: 220px;
        }

        #letter-btn {
            top: 450px;
            left: 30px;
        }

        .enlarged {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background-color: #fff;
            border: 3px solid #87CEEB;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            overflow: auto;
            display: none;
            width: 90%;
            max-width: 90%;
            height: auto;
            max-height: 80vh;
        }
    </style>
</head>
<body>
    <div class="desk">
        <div class="section top-section">
            <button id="book-btn" class="button" onclick="showBook()"></button>
        </div>
        <div class="section bottom-section">
            <button id="tablet-btn" class="button" onclick="showTablet()"></button>
            <button id="letter-btn" class="button" onclick="showLetter()"></button>
        </div>
    </div>

    <div class="enlarged" id="bookView">
        <button onclick="hideEnlarged()">뒤로가기</button>
        <p>추억의 책 내용</p>
    </div>

    <div class="enlarged" id="tabletView">
        <button onclick="hideEnlarged()">뒤로가기</button>
        <p>추억의 영상 내용</p>
    </div>

    <div class="enlarged" id="letterView">
        <button onclick="hideEnlarged()">뒤로가기</button>
        <p>추억의 편지 내용</p>
    </div>

    <script>
        function showBook() {
            document.getElementById('bookView').style.display = 'block';
        }

        function showTablet() {
            document.getElementById('tabletView').style.display = 'block';
        }

        function showLetter() {
            document.getElementById('letterView').style.display = 'block';
        }

        function hideEnlarged() {
            document.getElementById('bookView').style.display = 'none';
            document.getElementById('tabletView').style.display = 'none';
            document.getElementById('letterView').style.display = 'none';
        }
    </script>
</body>
</html>
